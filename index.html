<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DAMAN VIP - Ultra Hyper-Animated Edition</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: #000205;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Moving Cyber Grid Background */
        body::before {
            content: "";
            position: absolute;
            inset: -50%;
            background-image: linear-gradient(rgba(0, 231, 1, 0.05) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(0, 184, 255, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: -3;
            animation: gridDrift 20s linear infinite;
        }
        @keyframes gridDrift {
            0% { transform: translateY(0); }
            100% { transform: translateY(40px); }
        }

        /* Sci-Fi Laser Scanline */
        .scanline {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, transparent, #00e701, #00b8ff, #ff007f, transparent);
            opacity: 0.8;
            z-index: 10;
            animation: scanMove 3s linear infinite;
            pointer-events: none;
            box-shadow: 0 0 15px rgba(0, 231, 1, 0.8);
        }
        @keyframes scanMove {
            0% { top: -5%; }
            100% { top: 105%; }
        }

        /* Interactive Canvas Background */
        #bg-canvas {
            position: absolute;
            inset: 0;
            z-index: -2;
            width: 100%;
            height: 100%;
        }

        /* 3D Floating Casino Elements */
        .floating-icon {
            position: absolute;
            font-size: 38px;
            opacity: 0.35;
            z-index: -1;
            filter: drop-shadow(0 0 20px rgba(0, 231, 1, 0.9));
            animation: hyperFloat 6s infinite ease-in-out alternate;
        }
        .icon-1 { top: 10%; left: 8%; animation-duration: 5s; }
        .icon-2 { bottom: 12%; left: 10%; animation-duration: 7s; animation-delay: 0.5s; }
        .icon-3 { top: 15%; right: 10%; animation-duration: 6s; animation-delay: 1s; }
        .icon-4 { bottom: 15%; right: 12%; animation-duration: 8s; animation-delay: 1.2s; }

        @keyframes hyperFloat {
            0% { transform: translateY(0px) rotate(0deg) scale(1); }
            100% { transform: translateY(-45px) rotate(45deg) scale(1.3); filter: drop-shadow(0 0 35px rgba(255, 0, 127, 1)); }
        }

        /* Massive Fluid Ambient Orbs */
        .ambient-orb {
            position: absolute;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            filter: blur(140px);
            z-index: -1;
            opacity: 0.4;
            animation: orbMorph 8s infinite alternate ease-in-out;
        }
        .orb-1 { background: #00e701; top: -200px; left: -200px; }
        .orb-2 { background: #00b8ff; bottom: -200px; right: -200px; animation-duration: 10s; }
        .orb-3 { background: #ff007f; top: 50%; left: 50%; transform: translate(-50%, -50%); animation-duration: 7s; }

        @keyframes orbMorph {
            0% { transform: scale(0.7) translate(0, 0) rotate(0deg); }
            100% { transform: scale(1.3) translate(60px, -50px) rotate(180deg); }
        }

        /* Ultra-Smooth Cinematic Loader */
        #loader {
            position: fixed;
            inset: 0;
            background: #000205;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }
        .loader-spinner {
            width: 90px;
            height: 90px;
            border: 4px solid rgba(255, 255, 255, 0.05);
            border-top: 4px solid #00e701;
            border-right: 4px solid #00b8ff;
            border-bottom: 4px solid #ff007f;
            border-radius: 50%;
            animation: spinLoader 0.45s cubic-bezier(0.4, 0, 0.2, 1) infinite;
            box-shadow: 0 0 50px rgba(0, 231, 1, 0.7);
            margin-bottom: 25px;
        }
        @keyframes spinLoader {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .loader-text {
            font-size: 17px;
            font-weight: 900;
            letter-spacing: 6px;
            background: linear-gradient(45deg, #00e701, #00b8ff, #ff007f);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: textNeonPulse 0.8s infinite alternate;
        }
        @keyframes textNeonPulse {
            from { opacity: 0.5; filter: drop-shadow(0 0 5px rgba(0,231,1,0.5)); }
            to { opacity: 1; filter: drop-shadow(0 0 25px rgba(0,231,1,1)); }
        }

        /* Holographic Card Wrapper with Extreme Rotating Border */
        .card-wrapper {
            position: relative;
            width: 100%;
            max-width: 440px;
            padding: 4px;
            border-radius: 34px;
            background: linear-gradient(135deg, #00e701, #00b8ff, #ff007f, #7000ff, #00e701);
            background-size: 400% 400%;
            animation: borderFlow 4s linear infinite, cardEntrance 0.8s 0.3s forwards cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.95), 0 0 50px rgba(0, 231, 1, 0.3);
            transform: translateY(30px) scale(0.92);
            opacity: 0;
        }

        @keyframes cardEntrance {
            to { transform: translateY(0) scale(1); opacity: 1; }
        }

        @keyframes borderFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .card-inner {
            background: rgba(3, 6, 14, 0.94);
            backdrop-filter: blur(45px);
            -webkit-backdrop-filter: blur(45px);
            border-radius: 31px;
            padding: 45px 35px;
            text-align: center;
        }

        /* Branding */
        .brand-logo {
            font-size: 42px;
            font-weight: 900;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 6px;
            background: linear-gradient(45deg, #ffffff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .brand-logo span {
            color: #00e701;
            -webkit-text-fill-color: #00e701;
            text-shadow: 0 0 35px rgba(0, 231, 1, 0.9);
        }
        .brand-subtitle {
            color: #94a3b8;
            font-size: 13px;
            letter-spacing: 1.8px;
            margin-bottom: 24px;
            text-transform: uppercase;
        }

        /* Invitation Code Badge */
        .invite-badge {
            background: rgba(0, 231, 1, 0.15);
            border: 1px solid rgba(0, 231, 1, 0.5);
            color: #00e701;
            padding: 12px;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 900;
            margin-bottom: 25px;
            letter-spacing: 2px;
            box-shadow: 0 0 25px rgba(0, 231, 1, 0.35);
            animation: badgeGlow 1.5s infinite alternate;
        }
        @keyframes badgeGlow {
            0% { box-shadow: 0 0 10px rgba(0,231,1,0.2); transform: scale(1); }
            100% { box-shadow: 0 0 30px rgba(0,231,1,0.6); transform: scale(1.02); }
        }

        /* Action Buttons Container */
        .action-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .portal-btn {
            position: relative;
            width: 100%;
            padding: 18px;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
        }

        /* Login Primary Neon Button */
        .btn-signin {
            background: linear-gradient(135deg, #00e701, #00b8ff);
            color: #000205;
            box-shadow: 0 12px 40px rgba(0, 231, 1, 0.6);
            border: none;
        }
        .btn-signin:hover {
            transform: translateY(-5px) scale(1.04);
            box-shadow: 0 20px 55px rgba(0, 231, 1, 0.9);
            filter: brightness(1.25);
        }

        /* Register Secondary Neon Button */
        .btn-signup {
            background: linear-gradient(135deg, #ff007f, #7000ff);
            color: #ffffff;
            box-shadow: 0 12px 40px rgba(255, 0, 127, 0.5);
            border: none;
        }
        .btn-signup:hover {
            transform: translateY(-5px) scale(1.04);
            box-shadow: 0 20px 55px rgba(255, 0, 127, 0.8);
            filter: brightness(1.25);
        }

        /* High-Speed Button Shine Effect */
        .portal-btn::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(60deg, transparent, rgba(255,255,255,0.4), transparent);
            transform: rotate(45deg) translateX(-100%);
            transition: transform 0.5s ease;
        }
        .portal-btn:hover::after {
            transform: rotate(45deg) translateX(100%);
        }

        /* Footer Meta */
        .footer-meta {
            margin-top: 30px;
            font-size: 12px;
            color: #64748b;
            letter-spacing: 1.2px;
        }
        .footer-meta span {
            color: #00e701;
            font-weight: 700;
        }
    </style>
</head>
<body>

    <!-- Sci-Fi Scanline -->
    <div class="scanline"></div>

    <!-- 3D Floating Icons -->
    <div class="floating-icon icon-1">🎲</div>
    <div class="floating-icon icon-2">🎰</div>
    <div class="floating-icon icon-3">💎</div>
    <div class="floating-icon icon-4">🪙</div>

    <!-- Interactive Canvas Background -->
    <canvas id="bg-canvas"></canvas>

    <!-- Ambient Glowing Orbs -->
    <div class="ambient-orb orb-1"></div>
    <div class="ambient-orb orb-2"></div>
    <div class="ambient-orb orb-3"></div>

    <!-- Cinematic Loader -->
    <div id="loader">
        <div class="loader-spinner"></div>
        <div class="loader-text">LOADING HYPER PORTAL...</div>
    </div>

    <!-- Main Holographic Card -->
    <div class="card-wrapper">
        <div class="card-inner">
            <div class="brand-logo">DAMAN <span>VIP</span></div>
            <div class="brand-subtitle">High-Stakes Official Gaming Hub</div>

            <div class="invite-badge">
                CODE: 412518325625
            </div>

            <div class="action-container">
                <!-- Updated Sign In Link -->
                <a href="https://www.damanclub.kim/#/register?invitationCode=412518325625" class="portal-btn btn-signin" target="_blank">Sign In / Login</a>
                
                <!-- Updated Register Link -->
                <a href="https://www.damanclub.kim/#/register?invitationCode=412518325625" class="portal-btn btn-signup" target="_blank">Register Now</a>
            </div>

            <div class="footer-meta">
                Encrypted 256-bit Session &bull; <span>Provably Fair 🔒</span>
            </div>
        </div>
    </div>

    <script>
        // Cinematic Loader Fade Out
        window.addEventListener('load', () => {
            setTimeout(() => {
                const loader = document.getElementById('loader');
                loader.style.opacity = '0';
                loader.style.visibility = 'hidden';
            }, 600);
        });

        // Ultra-Smooth High-Performance Particle Network + Magnetism Animation
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        let particlesArray = [];
        const numberOfParticles = 85;

        class Particle {
            constructor(x, y) {
                this.x = x || Math.random() * canvas.width;
                this.y = y || Math.random() * canvas.height;
                this.size = Math.random() * 3.5 + 1;
                this.speedX = (Math.random() - 0.5) * 1.5;
                this.speedY = (Math.random() - 0.5) * 1.5;
                const colors = ['#00e701', '#00b8ff', '#ff007f', '#7000ff'];
                this.color = colors[Math.floor(Math.random() * colors.length)];
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.x < 0 || this.x > canvas.width) this.speedX = -this.speedX;
                if (this.y < 0 || this.y > canvas.height) this.speedY = -this.speedY;
            }
            draw() {
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 18;
                ctx.shadowColor = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function initParticles() {
            particlesArray = [];
            for (let i = 0; i < numberOfParticles; i++) {
                particlesArray.push(new Particle());
            }
        }
        initParticles();

        // Mouse / Touch Tracking for Dynamic Particle Trail
        let mouse = { x: null, y: null, active: false };
        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
            mouse.active = true;
            for (let i = 0; i < 2; i++) {
                particlesArray.push(new Particle(mouse.x, mouse.y));
                if (particlesArray.length > 130) particlesArray.shift();
            }
        });

        window.addEventListener('touchmove', (e) => {
            if(e.touches.length > 0) {
                mouse.x = e.touches[0].clientX;
                mouse.y = e.touches[0].clientY;
                particlesArray.push(new Particle(mouse.x, mouse.y));
                if (particlesArray.length > 130) particlesArray.shift();
            }
        });

        function animateCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < particlesArray.length; i++) {
                particlesArray[i].update();
                particlesArray[i].draw();

                // Connect nearby particles with glowing spiderweb lines
                for (let j = i; j < particlesArray.length; j++) {
                    const dx = particlesArray[i].x - particlesArray[j].x;
                    const dy = particlesArray[i].y - particlesArray[j].y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    if (distance < 130) {
                        ctx.strokeStyle = `rgba(0, 231, 1, ${0.25 - distance/550})`;
                        ctx.lineWidth = 0.9;
                        ctx.beginPath();
                        ctx.moveTo(particlesArray[i].x, particlesArray[i].y);
                        ctx.lineTo(particlesArray[j].x, particlesArray[j].y);
                        ctx.stroke();
                    }
                }
            }
            requestAnimationFrame(animateCanvas);
        }
        animateCanvas();
    </script>
</body>
</html>
